<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saathi Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-sized app centred on a dark stage with demo controls beside it.
   Below 760px wide the app fills the screen and the controls open from a small "demo" button. */
:root{
  color-scheme:dark;
  --stage:#070707; --ink:#F2F2F2; --ink2:#A8A8A8; --ink3:#8A8A8A;
  --lime:#C8FF2E; --onlime:#0A0A0A; --red:#FF4D5E; --red2:#FF8A95; --amber:#FFC23D;
  --line:rgba(255,255,255,.12); --glass:rgba(255,255,255,.05); --sheet:#0E0E0E; --dlg:#151515;
  --f-display:'Space Grotesk','Noto Sans Devanagari',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --top:52px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-display);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:40px;padding-block:20px;padding-inline:16px}
.frame{position:relative;flex:none}
.device{position:absolute;left:0;top:0;width:390px;height:844px;transform:scale(var(--s,1));transform-origin:0 0;border-radius:46px;overflow:hidden;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 0 0 8px #151515,0 0 0 9px rgba(255,255,255,.08),0 50px 100px -30px rgba(0,0,0,.9)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:#000;font-family:var(--f-display);color:var(--ink)}
.demo-fab{display:none}
body.mobile{--top:20px}
body.mobile .stage{display:block;padding:0;height:100%;min-height:0}
body.mobile .frame{width:100%!important;height:100%!important}
body.mobile .device{position:relative;width:100%;height:100%;transform:none;border-radius:0;box-shadow:none}
body.mobile .panel{position:fixed;left:0;right:0;bottom:0;max-height:78%;width:auto;border-radius:24px 24px 0 0;z-index:200;transform:translateY(105%);transition:transform .25s ease;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
body.mobile.panel-open .panel{transform:none}
body.mobile .demo-fab{display:flex;position:fixed;left:10px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:150;width:44px;height:44px;align-items:center;justify-content:center;border-radius:50%;border:1px solid rgba(200,255,46,.5);background:rgba(10,10,10,.88);color:var(--lime);cursor:pointer}

/* ---------- demo panel ---------- */
.panel{width:300px;max-height:calc(100vh - 40px);overflow-y:auto;background:#0D0D0D;border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.pc-head{display:flex;align-items:center;gap:10px}
.pc-mark{font-weight:700;font-size:20px;letter-spacing:-.03em}
.pc-mark span{color:var(--lime)}
.pc-tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);border:1px solid var(--line);border-radius:6px;padding:2px 6px}
.pc-x{margin-left:auto;display:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;align-items:center;justify-content:center}
body.mobile .pc-x{display:flex}
.pc-note{margin:0;font-size:13px;line-height:1.45;color:var(--ink2)}
.pc h3{margin:4px 0 0;font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.pc-row{display:flex;flex-wrap:wrap;gap:6px}
.pc-row button,.pc-net{min-height:36px;padding:7px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.03);cursor:pointer;font-size:13px;font-weight:500}
.pc-row button:hover,.pc-net:hover{border-color:rgba(200,255,46,.6)}
.pc-row button.on{background:var(--lime);color:var(--onlime);border-color:var(--lime)}
.pc-net{display:flex;align-items:center;gap:10px;width:100%;justify-content:space-between}
.pc-hint{margin:-6px 0 0;font-size:12px;line-height:1.45;color:var(--ink3)}
.pc-tips{margin:0;padding-left:18px;font-size:12.5px;line-height:1.55;color:var(--ink2)}
.pc-tips b{color:var(--ink)}

/* ---------- app primitives ---------- */
#app p,#app h1,#app h2,#app h3{margin:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:#000}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;position:relative}
.scroll::-webkit-scrollbar{display:none}
.pad{position:relative;padding:var(--top) 20px 110px;display:flex;flex-direction:column;gap:12px}
.fade{animation:fadeIn .22s ease}
.glow{position:absolute;border-radius:50%;pointer-events:none}
.smoke{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.025));backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:20px}
.mono{font-family:var(--f-mono)}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;color:var(--ink3);text-transform:uppercase}
.xs{font-size:11.5px}
.dim{color:var(--ink2)}.lime{color:var(--lime)}.red{color:var(--red)}.amb{color:var(--amber)}
.ic{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:block;flex:none}
.spin{animation:spin 1s linear infinite}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:10px}
.top.tight{min-height:0}
.h1{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.04em;text-wrap:balance}
.h1.s36{font-size:36px}
.h2{font-size:30px;line-height:1.02;font-weight:700;letter-spacing:-.04em}
.word{font-weight:700;font-size:21px;letter-spacing:-.03em}
.link{background:none;border:0;padding:6px 0;cursor:pointer;min-height:36px}
.row,.rowbtn{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.rowbtn{padding:0}
.row:disabled{cursor:default}
.list{padding:2px 0}
.av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05)}
.av.amb{color:var(--amber);border-color:rgba(255,194,61,.4)}
.tile{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:none;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.tile.on{color:var(--lime);border-color:rgba(200,255,46,.35)}
.tile.warn{color:var(--amber);border-color:rgba(255,194,61,.35)}
.hr{height:1px;margin:0 14px;background:rgba(255,255,255,.08)}
.t1{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.t2{display:block;font-size:12.5px;color:var(--ink2);margin-top:3px}
.mn{flex:1;min-width:0;display:block}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{font-size:13.5px;font-family:var(--f-mono)}
.tag{font-family:var(--f-mono);font-size:9.5px;font-weight:600;letter-spacing:.08em;padding:2px 6px;border-radius:6px;text-transform:uppercase;flex:none;line-height:1.4}
.tag.r{color:var(--red);background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.45)}
.tag.a{color:var(--amber);background:rgba(255,194,61,.1);border:1px solid rgba(255,194,61,.4)}
.tag.l{color:var(--lime);background:rgba(200,255,46,.08);border:1px solid rgba(200,255,46,.4)}
.tag.w{color:#C8C8C8;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2)}
.pan{padding:14px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:14px;font-weight:700;font-size:16px;border:0;cursor:pointer;width:100%;text-decoration:none}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn.l{background:var(--lime);color:var(--onlime)}
.btn.g{background:transparent;color:var(--ink);border:1px solid rgba(255,255,255,.22);font-weight:600}
.btn.r{background:var(--red);color:var(--onlime)}
.btn.a{background:var(--amber);color:var(--onlime)}
.btn.sm{height:44px;font-size:14px;width:auto;padding:0 16px;border-radius:12px}
.btn.grow{flex:1}
.btnrow{display:flex;gap:8px;margin-top:12px;align-items:center}
.okc{width:22px;height:22px;border-radius:50%;background:var(--lime);color:var(--onlime);display:flex;align-items:center;justify-content:center;flex:none}
.numc{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--f-mono);font-size:11px;color:var(--ink2)}
.numc.cur{border-color:var(--ink);color:var(--ink)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(255,255,255,.35);flex:none;display:block}
.radio.on{border:6px solid var(--lime)}
.radio-b{width:44px;height:44px;margin:-12px -12px -12px 0;display:flex;align-items:center;justify-content:center;background:none;border:0;cursor:pointer;flex:none}
.seg{flex:1;height:44px;border:0;border-radius:12px;font-weight:600;font-size:14px;color:var(--ink2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.seg.on{background:var(--lime);color:var(--onlime)}
.segrow{display:flex;gap:4px}
.segbox{display:flex;gap:3px;padding:3px;border-radius:12px;border:1px solid rgba(255,255,255,.16);flex:none}
.segbox .seg{height:38px;padding:0 12px;flex:none;border-radius:9px;font-size:13.5px}
.chips{display:flex;gap:7px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-right:24px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 13px;border-radius:10px;font-size:13.5px;font-weight:500;color:#C8C8C8;background:transparent;border:1px solid rgba(255,255,255,.2);cursor:pointer}
.chip.on{color:var(--onlime);background:var(--lime);border-color:var(--lime)}
.chip.add{border-style:dashed;color:var(--ink2);font-size:12.5px;padding:7px 11px}
.inp{font-size:15px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:11px 12px;outline:none;width:100%;min-width:0}
.inp:focus{border-color:rgba(200,255,46,.6)}
textarea.inp{resize:none;font-family:var(--f-mono);font-size:12.5px;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.keyf{display:flex;align-items:center;margin-top:8px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.04)}
.keyf:focus-within{border-color:rgba(200,255,46,.6)}
.keyf input{flex:1;min-width:0;font-family:var(--f-mono);font-size:13px;background:none;border:0;outline:none;padding:12px}
.keyf.bad,.keyf.bad:focus-within{border-color:var(--red);background:rgba(255,77,94,.06)}
.keyf.ok{border-color:rgba(200,255,46,.5)}
.eye{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--ink2);flex:none;background:none;border:0;cursor:pointer}
.err{display:flex;gap:8px;margin-top:8px;font-size:13px;line-height:1.4;color:var(--red2)}
.err .ic{color:var(--red);margin-top:1px}
.okline{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--f-mono);font-size:11.5px;color:var(--lime)}
.saved{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--lime)}
.saving{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--ink2)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px;background:var(--lime);box-shadow:0 0 12px rgba(200,255,46,.6);transition:width .25s linear}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.14)}
.segs i.on{background:var(--lime)}
.segs i.cur{background:var(--ink)}
.empty{font-size:13.5px;color:var(--ink2);line-height:1.5;padding:8px 2px}
.banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.35}
.banner.amb{background:rgba(255,194,61,.07);border:1px solid rgba(255,194,61,.35);color:#E9D9AE}
.banner.lime{background:rgba(200,255,46,.06);border:1px solid rgba(200,255,46,.35);color:#E2F7B5}
.tgl{position:relative;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.18);flex:none;border:0;cursor:pointer;padding:0}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink);transition:left .15s}
.tgl.on{background:var(--lime)}
.tgl.on::after{left:23px;background:var(--onlime)}

/* today */
.avatar{position:relative;width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--onlime);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer}
.adot{position:absolute;top:0;right:0;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #000}
.status{display:flex;align-items:center;gap:6px}
.status i{width:6px;height:6px;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:12px 4px;border-radius:18px}
.stats>div{padding:0 12px;min-width:0}
.stats>div+div{border-left:1px solid rgba(255,255,255,.1)}
.stats b{display:block;font-size:24px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap}
.stats span{display:block;margin-top:4px;font-size:9.5px}
.modes{padding:4px;border-radius:16px}
.delay{display:flex;align-items:center;gap:10px;padding:6px 6px 2px 10px}
.stepb{width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;background:none;cursor:pointer}
.dnum{font-size:15px;width:44px;text-align:center}
.mhint{padding:10px 10px 8px;line-height:1.4}
.need{border-color:rgba(255,77,94,.35)}
.bpill{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:8px;height:46px;padding:0 16px 0 14px;border-radius:23px;background:rgba(24,24,24,.9);border:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:5;max-width:calc(100% - 32px)}

/* sheets, dialogs, snackbar */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.66);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--top) - 8px);border-radius:30px 30px 0 0;background:var(--sheet);border-top:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;box-shadow:0 -30px 60px rgba(0,0,0,.8);z-index:21}
.sheet.you{top:calc(var(--top) + 4px)}
.shead{flex:none;padding:10px 20px 4px;display:flex;flex-direction:column;gap:8px}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);align-self:center;flex:none;border:0;padding:0;cursor:pointer}
.sbody{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:6px 20px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sbody::-webkit-scrollbar{display:none}
.back{display:flex;align-items:center;gap:2px;height:44px;font-size:14px;font-weight:500;color:var(--ink2);background:none;border:0;cursor:pointer;padding:0}
.closeb{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.07);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex:none}
.card{border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035)}
.card.on{border-color:rgba(200,255,46,.4)}
.chd{display:flex;align-items:center;gap:12px;padding:14px;width:100%}
.chd-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.cbody{padding:0 14px 12px}
.mrow{display:flex;align-items:center;gap:12px;min-height:44px;width:100%;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.mrow:disabled{opacity:.42;cursor:not-allowed}
.keyrow{display:flex;align-items:center;gap:8px;margin-top:2px}
.dlg-scrim{position:absolute;inset:0;background:rgba(0,0,0,.72);z-index:40}
.dlg{position:absolute;left:0;right:0;bottom:0;padding:10px 20px calc(28px + env(safe-area-inset-bottom,0px));border-radius:30px 30px 0 0;background:var(--dlg);border-top:1px solid rgba(255,255,255,.16);display:flex;flex-direction:column;z-index:41}
.dico{margin-top:18px;width:52px;height:52px;border-radius:16px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);color:var(--red);display:flex;align-items:center;justify-content:center}
.dlg h2{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:16px}
.dlg p{font-size:14.5px;line-height:1.45;margin-top:8px;color:var(--ink2)}
.dlg p b{color:var(--ink)}
.note{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px;border-radius:14px;background:rgba(255,194,61,.07);border:1px solid rgba(255,194,61,.3);font-size:13px;line-height:1.4;color:#E6D3A3}
.snack{position:absolute;left:14px;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;padding:6px 6px 6px 12px;min-height:56px;border-radius:16px;background:#1C1C1C;border:1px solid rgba(255,255,255,.16);box-shadow:0 24px 50px -10px rgba(0,0,0,.95);z-index:60}
.snack.ok{border-color:rgba(200,255,46,.45)}
.snack.err{border-color:rgba(255,77,94,.55)}
.snack .sb{background:none;border:0;cursor:pointer;height:44px;padding:0 14px;font-weight:700;font-size:14px;color:var(--lime);display:flex;align-items:center;gap:6px;flex:none}
.erc{width:26px;height:26px;border-radius:50%;background:var(--red);color:var(--onlime);display:flex;align-items:center;justify-content:center;flex:none}
.enter.sheet,.enter.dlg{animation:up .3s cubic-bezier(.2,.8,.2,1)}
.enter.scrim,.enter.dlg-scrim{animation:fadeIn .2s ease}
.leave.sheet{animation:down .2s ease forwards}
.leave.scrim{animation:fadeOut .2s ease forwards}
.enter.snack{animation:snackIn .25s cubic-bezier(.2,.8,.2,1)}

/* setup */
.step{display:flex;align-items:center;gap:12px;padding:10px 14px;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.step:disabled{cursor:default}
.stepx{margin:4px 8px;padding:14px 12px;border-radius:16px;border:1.5px solid rgba(200,255,46,.55);background:rgba(200,255,46,.04)}
.stepx .why{font-size:13px;line-height:1.45;color:var(--ink2);margin-top:10px}
.subchk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}

/* calls */
.bub{max-width:84%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.bub.in{align-self:flex-start;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1);border-bottom-left-radius:5px}
.bub.out{align-self:flex-end;border:1px solid rgba(200,255,46,.45);color:#E9FFC0;border-bottom-right-radius:5px}
.bub.fill{align-self:flex-end;background:var(--lime);color:var(--onlime);border-bottom-right-radius:5px}
.bub.you{align-self:flex-end;background:var(--ink);color:var(--onlime);border-bottom-right-radius:5px}
.bmeta{font-family:var(--f-mono);font-size:10.5px;color:var(--ink2);align-self:flex-end;margin-top:-4px}
.bmeta.l{align-self:flex-start}
.tx{display:flex;flex-direction:column;gap:8px}
.callbtn{width:70px;height:70px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
.livepill{position:absolute;top:calc(var(--top) - 40px);left:14px;right:14px;min-height:56px;border-radius:28px;padding:0 8px 0 18px;display:flex;align-items:center;gap:10px;background:#000;border:1px solid rgba(200,255,46,.5);box-shadow:0 12px 30px rgba(0,0,0,.8),0 0 30px -8px rgba(200,255,46,.4);z-index:5}
body.mobile .livepill{top:10px}
.livepill.you{border-color:rgba(255,255,255,.3);box-shadow:0 12px 30px rgba(0,0,0,.8)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 5px rgba(200,255,46,.18),0 0 14px var(--lime);flex:none;animation:pulse 1.6s ease-in-out infinite}
.pillbtn{height:42px;padding:0 16px;border-radius:21px;border:0;font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;cursor:pointer;flex:none}
.compose{position:absolute;left:16px;right:16px;bottom:calc(24px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px}
.compose input{flex:1;min-width:0;height:50px;border-radius:25px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.04);padding:0 18px;outline:none;font-size:14px}
.compose input:disabled{color:var(--ink2)}
.endb{width:56px;height:56px;border-radius:50%;background:var(--red);color:var(--onlime);display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex:none}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes snackIn{from{transform:translateY(20px);opacity:0}}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(200,255,46,.08),0 0 14px var(--lime)}}

    setPrimary: function (v) {
      var b = S.brain;
      if (v === 'local') {
        if (!localModel()) { snack('Download Gemma first', 'it takes about 3 minutes on fast Wi-Fi', { kind: 'err' }); render(); return; }
      } else if (!b[v].key) {
        b.open = v === 'openai' ? 'openai' : b.open;
        snack('Add a ' + (v === 'gemini' ? 'Gemini' : 'ChatGPT') + ' key first', 'then it can answer your calls', { kind: 'err' });
        render(); return;
      }
      if (b.primary === v) return;
      var before = b.primary;
      b.primary = v;
      snack(v === 'local' ? 'Gemma answers every call' : (v === 'gemini' ? 'Gemini' : 'ChatGPT') + ' answers first', v === 'local' ? 'on this phone · no internet needed' : (localModel() && b.backup ? 'gemma covers offline' : null), { action: 'Undo', fn: function () { b.primary = before; render(); } });
      render();
    },
    openOpenAI: function () { S.brain.open = S.brain.open === 'openai' ? 'gemini' : 'openai'; render(); },
    keyShow: function (v) { S.brain[v].show = !S.brain[v].show; render(); },
    keyEdit: function (v) { var k = S.brain[v]; k.edit = true; k.draft = ''; k.state = 'idle'; k.err = ''; render(); var el = document.getElementById('key-' + v); if (el) el.focus(); },
    keyCancel: function (v) { var k = S.brain[v]; k.edit = false; k.draft = ''; k.state = 'idle'; render(); },
    keySave: function (v) {
      var k = S.brain[v], b = S.brain, draft = k.draft.trim();
      k.state = 'checking'; render();
      verify(v, draft, function (ok, err, secs) {
        if (!ok) { k.state = 'bad'; k.err = err; render(); return; }
        k.key = draft; k.draft = ''; k.edit = false; k.state = 'idle'; k.err = '';
        var switched = b.primary === 'local' || !b[b.primary] || !b[b.primary].key;
        if (switched) { b.primary = v; b.backup = true; }
        S.steps.brain = true;
        snack((v === 'gemini' ? 'Gemini' : 'ChatGPT') + ' key saved', 'verified in ' + secs.toFixed(1) + ' s' + (switched ? ' · now answering first' : ''), { action: 'Test call', fn: function () { simulate('courier'); } });
        render();
      });
    },
    keyRemove: function (v) {
      var b = S.brain, other = v === 'gemini' ? 'openai' : 'gemini', lm = localModel();
      var fallback = b.primary !== v ? null : (b[other].key ? other : (lm ? 'local' : 'none'));
      var name = v === 'gemini' ? 'Gemini' : 'ChatGPT';
      var body = fallback === 'local' ? '<b>' + LOCAL[lm].name + '</b> will answer every call on this phone until you add a key again.'
        : fallback === 'none' ? 'Saathi has no other brain, so it stops answering calls until you add a key.'
        : fallback ? '<b>' + (other === 'gemini' ? 'Gemini' : 'ChatGPT') + '</b> becomes the brain that answers first.' : 'Your other brain keeps answering calls.';
      confirmDlg({ icon: 'key', title: 'Remove ' + name + ' key?', body: body, ok: 'Remove key', cancel: 'Keep key', fn: function () {
        var saved = { key: b[v].key, primary: b.primary };
        b[v].key = ''; b[v].edit = false; b[v].draft = '';
        if (fallback && fallback !== 'none') b.primary = fallback;
        snack(name + ' key removed', fallback === 'local' ? 'gemma answers now' : (fallback === 'none' ? 'saathi can’t answer calls' : null), { kind: fallback === 'none' ? 'err' : 'plain', action: 'Undo', fn: function () { b[v].key = saved.key; b.primary = saved.primary; render(); } });
      } });
    },
    model: function (v) {
      var parts = v.split(':'), p = parts[0], k = S.brain[p];
      if (k.model === parts[1]) return;
      var before = k.model;
      k.model = parts[1];
      var m = (p === 'gemini' ? GEM : GPT).filter(function (x) { return x.id === parts[1]; })[0];
      snack('Model → ' + m.name, 'measured ' + m.s.toFixed(1) + ' s on this phone', { action: 'Undo', fn: function () { k.model = before; render(); } });
      render();
    },
    toggleBackup: function () {
      var b = S.brain;
      b.backup = !b.backup;
      snack(b.backup ? 'Offline backup on' : 'Offline backup off', b.backup ? 'gemma answers when there’s no internet' : 'calls need internet now', { kind: b.backup ? 'ok' : 'plain' });
      render();
    },
    setRole: function (v) {
      var b = S.brain, cloud = cloudWithKey();
      if (v === 'always') b.primary = 'local';
      else {
        if (b.primary === 'local') {
          if (!cloud) { snack('Add a cloud key first', 'Gemma keeps answering every call until Gemini or ChatGPT is set up', { kind: 'err' }); render(); return; }
          b.primary = cloud;
        }
        b.backup = v === 'offline';
      }
      snack({ always: 'Gemma answers every call', offline: 'Gemma answers when offline', never: 'Gemma won’t answer calls' }[v], { always: 'on this phone · no internet needed', offline: 'cloud first, on-device as backup', never: 'it stays installed' }[v], { kind: v === 'never' ? 'plain' : 'ok' });
      render();
    },
    setUnit: function (v) {
      if (S.local.unit === v) return;
      S.local.unit = v; stopTimer('test'); S.local.test = { st: 'idle', lines: [] };
      snack('On-device brain runs on ' + v.toUpperCase(), v === 'gpu' ? 'faster replies' : 'slower replies, phone stays cooler', { kind: 'plain' });
      render();
    },
    runTest: function () { runTest(); },
    stopTest: function () { stopTimer('test'); S.local.test = { st: 'idle', lines: [] }; render(); },
    download: function (v) { download(v); },
    dlPause: function (v) { var m = S.local[v]; m.userPaused = !m.userPaused; render(); },
    dlCancel: function (v) { var m = S.local[v]; stopTimer('dl' + v); stopTimer('dlt' + v); m.st = 'none'; m.p = 0; snack('Download cancelled', LOCAL[v].name, { kind: 'plain' }); render(); },
    e4b: function () { snack('Gemma 4 E4B needs 12 GB+ RAM', 'this phone has less, so Gemma 4 E2B is the best fit', { kind: 'err' }); render(); },
    delModel: function (v) {
      var b = S.brain, M = LOCAL[v], cloud = cloudWithKey();
      var otherLocal = v === 'gemma' ? (S.local.qwen.st === 'installed' ? 'qwen' : null) : (S.local.gemma.st === 'installed' ? 'gemma' : null);
      var body = 'Frees ' + M.gb + '. ';
      if (otherLocal) body += '<b>' + LOCAL[otherLocal].name + '</b> takes over on-device replies.';
      else if (b.primary === 'local') body += cloud ? 'Calls go to <b>' + (cloud === 'gemini' ? 'Gemini' : 'ChatGPT') + '</b> instead, so they need internet.' : 'Saathi has no other brain, so it stops answering calls.';
      else if (b.backup) body += 'Calls still go to <b>' + (cloud === 'openai' ? 'ChatGPT' : 'Gemini') + '</b>, but when you’re offline Saathi won’t answer.';
      confirmDlg({ title: 'Delete ' + M.name + '?', body: body, note: 'Getting it back means downloading ' + M.gb + ' again on Wi-Fi.', ok: 'Delete model', cancel: 'Keep it', fn: function () {
        S.local[v].st = 'none'; S.local[v].p = 0;
        if (!localModel() && b.primary === 'local' && cloud) b.primary = cloud;
        stopTimer('test'); S.local.test = { st: 'idle', lines: [] };
        snack(M.name + ' deleted', M.gb + ' freed', { kind: 'plain', action: 'Download again', fn: function () { download(v); } });
      } });
    },

    /* dialog + snack */
    dlgOk: function () { var d = S.dialog; S.dialog = null; if (d && d.fn) d.fn(); render(); },
    dlgCancel: function () { S.dialog = null; render(); },
    snackAct: function () { var s = S.snack; clearTimeout(T.snack); S.snack = null; if (s && s.fn) s.fn(); render(); },
    snackClose: function () { clearTimeout(T.snack); S.snack = null; render(); },

    /* incoming + live */
    letAnswer: function () { startLive(); },
    notNow: function () { stopTimer('inc'); if (S.incoming) S.incoming.back = true; render(); },
    decline: function () {
      stopTimer('inc');
      var c = S.incoming && S.incoming.caller;
      S.incoming = null; go('today');
      snack('Call declined', c ? c.number : null, { kind: 'plain' });
      render();
    },
    answerSelf: function () {
      stopTimer('inc');
      var inc = S.incoming;
      if (!inc) return;
      S.live = { caller: inc.caller, brain: brainNow(), lines: [], sec: 0, mode: 'you' };
      S.incoming = null; S.route = 'live';
      T.clock = setInterval(function () { if (S.live) { S.live.sec++; render(); } }, 1000);
      render();
    },
    stopAI: function () {
      var L = S.live;
      if (!L) return;
      stopTimer('live');
      L.mode = 'you'; L.typing = false; L.listening = false;
      snack(S.persona.name + ' stopped', 'you’re on the call · type and Samsung speaks it', { kind: 'plain' });
      render();
      var el = document.getElementById('live-msg'); if (el) el.focus();
    },
    endCall: function () { endCall(); },

    /* panel */
    sim: function (v) { simulate(v); },
    net: function () {
      S.online = !S.online;
      var b = brainNow();
      snack(S.online ? 'Back online' : 'You’re offline', S.online ? (b ? brainShort(b) + ' answers calls' : null) : (b ? 'gemma answers calls on this phone' : 'no offline brain is ready'), { kind: S.online || b ? 'plain' : 'err' });
      render();
    },
    fill: function (v) {
      var gem = v.indexOf('gem') === 0;
      if (gem && S.route === 'setup' && currentStep() === 'brain') { S.sk.draft = KEYS[v]; S.sk.state = 'idle'; render(); closePanelMobile(); return; }
      var p = gem ? 'gemini' : 'openai', k = S.brain[p];
      if (S.route === 'setup' || S.route === 'incoming' || S.route === 'live') { if (S.route === 'setup') go('today'); else return; }
      if (!S.sheets.some(function (s) { return s.name === 'brain'; })) { S.sheets = [{ name: 'you', entered: true }, { name: 'brain' }]; }
      else S.sheets = S.sheets.slice(0, S.sheets.map(function (s) { return s.name; }).indexOf('brain') + 1);
      if (!gem) S.brain.open = 'openai';
      if (k.key) k.edit = true;
      k.draft = KEYS[v]; k.state = 'idle'; k.err = ''; k.show = true;
      closePanelMobile();
      render();
    },
    jump: function (v) {
      if (S.incoming || S.live) { stopTimer('inc'); stopTimer('live'); stopTimer('clock'); stopTimer('sum'); S.incoming = null; S.live = null; }
      S.dialog = null;
      if (v === 'setup') { S.sheets = []; S.route = 'setup'; S.review = setupLeft() === 0 || S.steps.brain; }
      else if (v === 'today' || v === 'calls') go(v);
      else {
        S.route = 'today';
        var chain = { you: ['you'], persona: ['you', 'persona'], brain: ['you', 'brain'], ondevice: ['you', 'brain', 'ondevice'] }[v];
        S.sheets = chain.map(function (n, i) { return { name: n, entered: i < chain.length - 1 }; });
      }
      closePanelMobile();
      render();
    },
    reset: function (v) { clearTimers(); S = v === 'configured' ? configured() : fresh(); closePanelMobile(); render(); },
    panelClose: function () { closePanelMobile(); }
  };

  var IN = {
    skKey: function (v) { S.sk.draft = v; if (S.sk.state === 'bad') S.sk.state = 'idle'; return true; },
    key: function (v, el) { var k = S.brain[el.getAttribute('data-v')]; k.draft = v; if (k.state === 'bad') k.state = 'idle'; return true; },
    pName: function (v) { S.persona.name = v; liveGreeting(); debounceSave('id'); return false; },
    pOwner: function (v) { S.owner = v; liveGreeting(); debounceSave('id'); return false; },
    pIns: function (v) { S.persona.ins = v; debounceSave('ins'); return false; }
  };
  function liveGreeting() { var g = document.getElementById('greet'); if (g) g.textContent = greeting(); }
  function debounceSave(sec) { clearTimeout(T['d' + sec]); T['d' + sec] = setTimeout(function () { markSaving(sec); render(); }, 650); }

  /* ---------------- events ---------------- */
  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-a]');
    if (!t || t.disabled) return;
    if (!app.contains(t) && !panel.contains(t)) return;
    var fn = A[t.getAttribute('data-a')];
    if (fn) { e.preventDefault(); fn(t.getAttribute('data-v'), t); }
  });
  app.addEventListener('input', function (e) {
    var t = e.target.closest('[data-in]');
    if (!t) return;
    var fn = IN[t.getAttribute('data-in')];
    if (fn && fn(t.value, t)) render();
  });
  app.addEventListener('submit', function (e) {
    e.preventDefault();
    var el = document.getElementById('live-msg');
    if (!el || !S.live || !el.value.trim()) return;
    S.live.lines.push({ who: 'you', text: el.value.trim() });
    el.value = '';
    render();
  });
  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.id === 'sk-key') { e.preventDefault(); if (!checkKey('gemini', S.sk.draft) && S.sk.draft.trim()) A.skVerify(); }
    else if (t.id === 'key-gemini' || t.id === 'key-openai') {
      e.preventDefault();
      var p = t.id.slice(4);
      if (!checkKey(p, S.brain[p].draft) && S.brain[p].draft.trim() && S.brain[p].state !== 'checking') A.keySave(p);
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (document.body.classList.contains('panel-open')) { closePanelMobile(); return; }
    if (S.dialog) { S.dialog = null; render(); return; }
    if (S.sheets.length) closeTopSheet();
  });

  /* ---------------- layout ---------------- */
  var fab = document.getElementById('fab');
  fab.addEventListener('click', function () { document.body.classList.add('panel-open'); });
  function closePanelMobile() { document.body.classList.remove('panel-open'); }
  function fit() {
    var mobile = window.innerWidth < 760;
    document.body.classList.toggle('mobile', mobile);
    if (mobile) { frame.style.width = ''; frame.style.height = ''; device.style.removeProperty('--s'); return; }
    var s = Math.min(1, (window.innerHeight - 40) / 844);
    device.style.setProperty('--s', s);
    frame.style.width = (390 * s) + 'px';
    frame.style.height = (844 * s) + 'px';
    panel.style.maxHeight = Math.max(420, 844 * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  render();
})();
</script>
</body>
</html>
